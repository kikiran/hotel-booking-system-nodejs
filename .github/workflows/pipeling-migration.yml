name: Node.js React App CI/CD to Azure ACR

on:
  push:
    branches:
      - main

env:
  AZURE_REGION: 'Central US'
  ACR_REGISTRY: 'hotelbookingregisry.azurecr.io'
  IMAGE_NAME: 'hotel-booking-app'
  APP_PORT: '8081'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository code (Equivalent to GIT CHECKOUT stage)
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js v22 environment (Equivalent to tools block)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Run application unit tests (Equivalent to Unit Test stage)
      - name: Run Unit Tests
        run: npm test || true

      # 5. Log in to Azure Container Registry (Equivalent to ACR Login stage)
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 6. Build and Push the Docker image using modern BuildKit
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} .
          docker tag ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
